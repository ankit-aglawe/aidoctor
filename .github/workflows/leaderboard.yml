name: Leaderboard

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # to commit updated leaderboard.json
  pull-requests: write

jobs:
  scan-opt-in-repos:
    name: Scan ${{ matrix.repo.owner }}/${{ matrix.repo.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          # Generated from leaderboard.yaml. Repos here have opted in via PR.
          # If you maintain a repo listed here and want to remove it, open an issue.
          - { owner: aidoctor, name: aidoctor, ref: HEAD, paths: "src" }

    steps:
      - name: Checkout aidoctor
        uses: actions/checkout@v4
        with:
          path: aidoctor-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aidoctor
        run: pip install ./aidoctor-tool

      - name: Checkout target repo (${{ matrix.repo.owner }}/${{ matrix.repo.name }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo.owner }}/${{ matrix.repo.name }}
          ref: ${{ matrix.repo.ref }}
          path: target

      - name: Scan and emit score
        id: scan
        run: |
          cd target
          set +e
          aidoctor scan ${{ matrix.repo.paths }} --json > /tmp/score.json
          echo "score=$(python -c 'import json; print(json.load(open("/tmp/score.json"))["score"]["value"])')" >> "$GITHUB_OUTPUT"
          echo "label=$(python -c 'import json; print(json.load(open("/tmp/score.json"))["score"]["label"])')" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: score-${{ matrix.repo.owner }}-${{ matrix.repo.name }}
          path: /tmp/score.json

  collate:
    name: Update leaderboard.json
    runs-on: ubuntu-latest
    needs: scan-opt-in-repos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/scores
          merge-multiple: true

      - name: Merge into leaderboard.json
        run: |
          python <<'PY'
          import json, os, glob
          entries = []
          for f in sorted(glob.glob("/tmp/scores/*.json")):
              with open(f) as fh:
                  data = json.load(fh)
              entries.append({
                  "repo": os.path.basename(f).replace("score-", "").replace(".json", ""),
                  "score": data["score"]["value"],
                  "label": data["score"]["label"],
                  "violations": data["score"]["total_violations"],
              })
          entries.sort(key=lambda x: -x["score"])
          with open("leaderboard.json", "w") as fh:
              json.dump({"updated_at": os.environ.get("GITHUB_SHA", "unknown"), "entries": entries}, fh, indent=2)
          PY

      - name: Commit updates
        run: |
          git config user.name "aidoctor-bot"
          git config user.email "bot@aidoctor.dev"
          git add leaderboard.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: nightly leaderboard refresh"
            git push
          fi
