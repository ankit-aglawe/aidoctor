[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidoctor"
version = "1.1.0"
description = "Your agent writes bad Python. This catches it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aidoctor maintainers" }]
keywords = ["lint", "ai", "claude", "cursor", "python", "linter", "doctor", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "libcst>=1.0,<2.0",
    "click>=8.1,<9.0",
    "rich>=13.0,<15.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "tomli>=2.0,<3.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
aidoctor = "aidoctor.cli:main"

[project.urls]
Homepage = "https://github.com/ankit-aglawe/aidoctor"
Documentation = "https://github.com/ankit-aglawe/aidoctor#readme"
Repository = "https://github.com/ankit-aglawe/aidoctor"
Issues = "https://github.com/ankit-aglawe/aidoctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aidoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.aidoctor]
fail_on = "none"
